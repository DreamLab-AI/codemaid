[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DreamLab-AI/codemaid"
authors = ["jjohare"]
keywords = ["mermaid", "diagram", "codemap", "static-analysis", "llm"]
categories = ["development-tools", "visualization"]

[workspace.dependencies]
codemaid-model = { path = "crates/codemaid-model", version = "0.1.0" }
codemaid-mermaid = { path = "crates/codemaid-mermaid", version = "0.1.0" }
codemaid-rust = { path = "crates/codemaid-rust", version = "0.1.0", default-features = false }
codemaid-corpus = { path = "crates/codemaid-corpus", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
toml = "0.8"
rayon = "1"
ignore = "0.4.23"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamLab-AI/sealmap"
homepage = "https://github.com/DreamLab-AI/sealmap"
authors = ["jjohare"]
keywords = ["mermaid", "diagram", "codemap", "static-analysis", "llm"]
categories = ["development-tools", "visualization"]

[workspace.dependencies]
sealmap-model = { path = "crates/sealmap-model", version = "0.1.0" }
sealmap-extract = { path = "crates/sealmap-extract", version = "0.1.0", default-features = false }
sealmap-mermaid = { path = "crates/sealmap-mermaid", version = "0.1.0" }
sealmap-rust = { path = "crates/sealmap-rust", version = "0.1.0", default-features = false }
sealmap-corpus = { path = "crates/sealmap-corpus", version = "0.1.0" }
sealmap-dense = { path = "crates/sealmap-dense", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
toml = "0.8"
rayon = "1"
# Cargo.lock pins 0.4.29: 0.4.30 needs Rust 1.88 but declares no
# rust-version; 0.4.31+ declare 1.88. On a 1.85 toolchain outside this
# workspace, `cargo update -p ignore --precise 0.4.29` does the same.
ignore = "0.4.23"
clap = { version = "4", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

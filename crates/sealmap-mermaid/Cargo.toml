[package]
name = "sealmap-mermaid"
description = "Typed, deterministic Mermaid writers (sequence, class, ER, flowchart) with safe escaping and injective ids derived from sym: symbol ids"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sealmap-mermaid"
authors.workspace = true
keywords = ["mermaid", "diagram", "sequence-diagram", "class-diagram", "markdown"]
categories.workspace = true

[features]
default = ["model"]
## `Ident::from_symbol`: injective diagram ids from `sealmap_model::SymbolId`.
## Without it the writers have no dependencies at all.
model = ["dep:sealmap-model"]

[dependencies]
sealmap-model = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package]
name = "sealmap"
description = "Deterministic code maps and sealed diagram contracts for LLM development harnesses: stable symbol ids, signature and body hashes, a seal lockfile checked in CI, and dense Mermaid views"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sealmap"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["cli", "parallel"]
## The `sealmap` command-line tool.
cli = ["dep:clap"]
## Parallel parsing (output is identical either way).
parallel = ["sealmap-rust/parallel", "sealmap-extract/parallel"]

[dependencies]
sealmap-model.workspace = true
sealmap-extract.workspace = true
sealmap-mermaid.workspace = true
sealmap-rust.workspace = true
sealmap-corpus.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }

[[bin]]
name = "sealmap"
required-features = ["cli"]

[lints]
workspace = true

[[test]]
name = "cli"
required-features = ["cli"]

[package]
name = "sealmap-extract"
description = "Language-neutral extraction core for sealmap language adapters: raw flow IR, flow lowering, call aggregation, confidence policy, label rules, sym: id builder, token-stream fingerprints and panic-isolated collection"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sealmap-extract"
authors.workspace = true
keywords = ["static-analysis", "call-graph", "codemap", "mermaid", "llm"]
categories.workspace = true

[features]
default = ["parallel"]
## Run isolated collection on a rayon pool. Output is identical with or without it.
parallel = ["dep:rayon"]

[dependencies]
sealmap-model.workspace = true
blake3.workspace = true
rayon = { workspace = true, optional = true }

[lints]
workspace = true

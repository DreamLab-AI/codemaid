[package]
name = "sealmap-rust"
description = "Pure-Rust (syn) frontend for sealmap: extracts symbols, relations and ordered call flows from Rust workspaces"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["parallel"]
## Parse files on all cores with rayon. Output is identical with or without it.
parallel = ["sealmap-frontend/parallel"]

[dependencies]
sealmap-model.workspace = true
sealmap-frontend.workspace = true
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true
toml.workspace = true
thiserror.workspace = true

[lints]
workspace = true
